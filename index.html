<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIJAZOS — Panel de control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">JJ</div>
      <div class="brand-text">
        <span class="brand-name">JIJAZOS</span>
        <span class="brand-sub">Panel de control</span>
      </div>
    </div>

    <nav class="nav">
      <a href="#" class="nav-item active" data-view="inicio">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Inicio
      </a>
      <a href="#" class="nav-item" data-view="grupos">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Grupos
      </a>
      <a href="#" class="nav-item" data-view="usuarios">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/></svg>
        Usuarios
      </a>
      <a href="#" class="nav-item" data-view="control">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M9 9.5V20"/></svg>
        Control general
      </a>
      <a href="#" class="nav-item" data-view="estadisticas">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7"/></svg>
        Estadísticas
      </a>
    </nav>

    <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Menú">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="globalSearch" placeholder="Buscar usuario o grupo...">
      </div>
      <div class="admin-chip">
        <div class="admin-avatar">S</div>
        <div class="admin-meta">
          <span>Administrador</span>
          <small>Sesión activa</small>
        </div>
      </div>
    </header>

    <div class="view-wrap" id="viewWrap">
      <!-- views injected by app.js -->
    </div>

  </main>
</div>

<!-- MODAL ROOT -->
<div class="modal-root" id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
